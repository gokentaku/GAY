<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 强制锁定浅色模式，防止 iOS webview 自动将背景变成纯黑 -->
    <meta name="color-scheme" content="light">
    <title>优雅躲避 - Apple风格小游戏</title>
    
    <style>
        :root {
            --bg-color: #f5f5f7;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #0071e3;
            --shadow-light: rgba(0, 0, 0, 0.05);
            --shadow-medium: rgba(0, 0, 0, 0.12);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f7 !important; /* 强制浅色背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* 彻底阻止移动端默认的滑动行为 */
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 850px;
            background-color: #ffffff !important; /* 强制白色容器 */
            box-shadow: 0 10px 30px var(--shadow-light);
            overflow: hidden;
        }

        @media (min-width: 501px) {
            #game-container {
                height: 90vh;
                border-radius: 40px;
                border: 8px solid #e5e5ea;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: transparent; 
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 顶部记分板 */
        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            box-shadow: 0 4px 12px var(--shadow-light);
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--text-primary);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .controls {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            pointer-events: auto;
            z-index: 10;
        }

        .control-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 24px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            box-shadow: 0 4px 12px var(--shadow-light);
            cursor: pointer;
            transition: background 0.1s;
        }

        .control-btn.active {
            background: rgba(0,0,0,0.1);
        }

        .control-icon {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .rainbow-text {
            background: linear-gradient(to right, #ff3b30, #ff9500, #4cd964, #5ac8fa, #007aff, #5856d6, #ff2d55);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            animation: hue-rotate 3s linear infinite;
        }

        @keyframes hue-rotate {
            from { filter: hue-rotate(0deg); }
            to { filter: hue-rotate(360deg); }
        }
        
        #game-over-reason {
            font-size: 22px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 核心游戏画布 -->
        <canvas id="gameCanvas"></canvas>

        <div class="ui-layer">
            <div class="header">
                <div class="score-board">坚持: <span id="score">0.0</span>s</div>
                <div class="score-board" id="invincible-indicator" style="opacity: 0; color: #ff9500;">无敌状态</div>
            </div>

            <!-- 开始菜单 -->
            <div id="start-screen" class="overlay">
                <h1 class="title">优雅闪避</h1>
                <p class="subtitle">点击下方按钮或左右屏幕控制移动。<br>躲避下落的文字，拾取发光球获得无敌状态。</p>
                <button class="btn" id="start-btn">开始挑战</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h1 class="title rainbow-text">游戏结束</h1>
                <div id="game-over-reason" class="rainbow-text">恭喜你变成了gay</div>
                <p class="subtitle">本次坚持了 <span id="final-score" style="font-weight: bold;">0</span> 秒</p>
                <button class="btn" id="restart-btn">再试一次</button>
            </div>

            <!-- 底部虚拟控制键 -->
            <div class="controls">
                <div class="control-btn" id="btn-left">
                    <svg class="control-icon" viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                </div>
                <div class="control-btn" id="btn-right">
                    <svg class="control-icon" viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </div>
            </div>
        </div>
    </div>

        // 兼容所有 iOS 的自定义圆角矩形绘制函数 (代替容易崩溃的 ctx.roundRect)
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        const GAME_STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let currentState = GAME_STATE.MENU;

        let width, height;
        function resize() {
            // 安全获取容器尺寸，防止 iOS Webview 初始化时拿到 0
            width = container.clientWidth || window.innerWidth || 300;
            height = container.clientHeight || window.innerHeight || 600;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            if (player) {
                player.y = height - player.totalHeight - 120;
            }
        }
        window.addEventListener('resize', resize);

        class Player {
            constructor() {
                this.totalHeight = 100;
                // 根据要求，头身比例大约 3:2，头部稍大
                this.headRadius = (this.totalHeight * 0.6) / 2;
                this.bodyWidth = 40;
                this.bodyHeight = this.totalHeight * 0.4;
                
                this.x = width / 2;
                this.y = height - this.totalHeight - 120;
                
                this.vx = 0;
                this.speed = 6.5;
                
                this.isInvincible = false;
                this.invincibleTimer = 0;
                
                this.isRainbow = false;
                this.rainbowHue = 0;
            }

            update(dt) {
                // 平滑的物理位移
                if (keys.left || btnLeftActive) {
                    this.vx = -this.speed;
                } else if (keys.right || btnRightActive) {
                    this.vx = this.speed;
                } else {
                    this.vx *= 0.8;
                }
                this.x += this.vx;

                // 边界碰撞
                const halfWidth = Math.max(this.headRadius, this.bodyWidth / 2);
                if (this.x - halfWidth < 0) this.x = halfWidth;
                if (this.x + halfWidth > width) this.x = width - halfWidth;

                // 状态计时器
                if (this.isInvincible) {
                    this.invincibleTimer -= dt;
                    if (this.invincibleTimer <= 0) {
                        this.isInvincible = false;
                        invincibleIndicator.style.opacity = 0;
                    } else {
                        // 闪烁效果
                        invincibleIndicator.style.opacity = Math.floor(this.invincibleTimer / 100) % 2 === 0 ? 1 : 0.5;
                    }
                }
                
                if (this.isRainbow) {
                    this.rainbowHue = (this.rainbowHue + 8) % 360;
                }
            }

            draw(ctx) {
                const headY = this.y + this.headRadius;
                
                ctx.save();
                // 绘制躯干
                if (this.isRainbow) {
                    ctx.fillStyle = `hsl(${this.rainbowHue}, 80%, 60%)`;
                } else {
                    ctx.fillStyle = '#8e9eab';
                }
                const bodyY = this.y + this.headRadius * 2 - 5;
                drawRoundedRect(ctx, this.x - this.bodyWidth/2, bodyY, this.bodyWidth, this.bodyHeight, 10);
                
                // 绘制腿部
                if (this.isRainbow) {
                    ctx.fillStyle = `hsl(${(this.rainbowHue+40)%360}, 80%, 50%)`;
                } else {
                    ctx.fillStyle = '#6b7a8a';
                }
                drawRoundedRect(ctx, this.x - 12, bodyY + this.bodyHeight - 5, 8, 20, 4);
                drawRoundedRect(ctx, this.x + 4, bodyY + this.bodyHeight - 5, 8, 20, 4);
                ctx.restore();

                ctx.save();
                
                // 无敌光环
                if (this.isInvincible) {
                    ctx.beginPath();
                    ctx.arc(this.x, headY, this.headRadius + 8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 149, 0, 0.3)';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(255, 149, 0, 0.8)';
                    ctx.stroke();
                }

                // 裁剪出圆形的头像区域
                ctx.beginPath();
                ctx.arc(this.x, headY, this.headRadius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();

                // 鲁棒的图像渲染
                if (headImageLoaded && headImage.width > 0) {
                    if (this.isRainbow) {
                        ctx.drawImage(headImage, this.x - this.headRadius, headY - this.headRadius, this.headRadius * 2, this.headRadius * 2);
                        // 覆盖一层色彩合成，实现彩虹脸
                        ctx.globalCompositeOperation = "color";
                        ctx.fillStyle = `hsl(${this.rainbowHue}, 100%, 50%)`;
                        ctx.fillRect(this.x - this.headRadius, headY - this.headRadius, this.headRadius * 2, this.headRadius * 2);
                    } else {
                        ctx.drawImage(headImage, this.x - this.headRadius, headY - this.headRadius, this.headRadius * 2, this.headRadius * 2);
                    }
                } else {
                    // 图片未加载时的防崩溃占位符
                    ctx.fillStyle = this.isRainbow ? `hsl(${this.rainbowHue}, 80%, 60%)` : '#d1d1d6';
                    ctx.fill();
                    ctx.fillStyle = '#1d1d1f';
                    ctx.font = "14px sans-serif";
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("加载中", this.x, headY);
                }

                // 头部内阴影增加 Apple 式的立体感
                ctx.beginPath();
                ctx.arc(this.x, headY, this.headRadius, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(0,0,0,0.15)";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.restore();
            }
            
            getHitbox() {
                return { x: this.x, y: this.y + this.headRadius, radius: this.headRadius * 0.8 };
            }
        }

        class Enemy {
            constructor(speedMultiplier) {
                this.text = "gay";
                this.fontSize = Math.random() * 14 + 20; // 随机大小
                this.x = Math.random() * (width - 40) + 20;
                this.y = -50;
                
                // 莫兰迪低饱和色系
                const grays = ['#86868b', '#aeaeb2', '#c7c7cc'];
                this.color = grays[Math.floor(Math.random() * grays.length)];
                
                this.vy = (Math.random() * 2 + 3) * speedMultiplier; 
                this.active = true;
            }

            update(dt) {
                this.y += this.vy;
                if (this.y > height + 50) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.font = `800 ${this.fontSize}px sans-serif`;
                ctx.fillStyle = this.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
            
            getHitbox() {
                return { x: this.x, y: this.y, radius: this.fontSize * 0.4 };
            }
        }

        class Item {
            constructor() {
                this.radius = 12;
                this.x = Math.random() * (width - 40) + 20;
                this.y = -30;
                this.vy = 2.5;
                this.active = true;
                this.pulseTimer = 0;
            }

            update(dt) {
                this.y += this.vy;
                this.pulseTimer += dt;
                if (this.y > height + 50) this.active = false;
            }

            draw(ctx) {
                ctx.save();
                // 呼吸闪烁发光特效
                const scale = 1 + Math.sin(this.pulseTimer / 150) * 0.15;
                ctx.translate(this.x, this.y);
                ctx.scale(scale, scale);
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffcc00';
                ctx.fill();
                
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 10;
                ctx.fillStyle = 'rgba(255, 204, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            getHitbox() {
                return { x: this.x, y: this.y, radius: this.radius + 5 };
            }
        }

        let player, entities = [], score = 0, startTime = 0, lastTime = 0;
        let baseSpawnRate = 1000, spawnTimer = 0, itemSpawnTimer = 0, difficultyMultiplier = 1;

        // 操作状态
        const keys = { left: false, right: false };
        let btnLeftActive = false, btnRightActive = false;

        // 键盘操作
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // 稳健的触摸绑定，支持防穿透
        function bindBtn(el, setVarCallback) {
            const press = (e) => { e.preventDefault(); setVarCallback(true); el.classList.add('active'); };
            const release = () => { setVarCallback(false); el.classList.remove('active'); };
            el.addEventListener('mousedown', press);
            el.addEventListener('touchstart', press, { passive: false });
            window.addEventListener('mouseup', release);
            window.addEventListener('touchend', release);
        }
        
        bindBtn(btnLeft, (val) => btnLeftActive = val);
        bindBtn(btnRight, (val) => btnRightActive = val);

        function checkCollision(c1, c2) {
            const dx = c1.x - c2.x;
            const dy = c1.y - c2.y;
            return Math.sqrt(dx * dx + dy * dy) < (c1.radius + c2.radius);
        }

        let animationFrameId = null;

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if (currentState === GAME_STATE.PLAYING) {
                update(dt);
                draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            } else if (currentState === GAME_STATE.GAMEOVER) {
                // 仅更新彩虹状态，不生成新敌人
                if (player.isRainbow) player.update(dt);
                draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function update(dt) {
            score = (Date.now() - startTime) / 1000;
            scoreEl.textContent = score.toFixed(1);

            // 难度随着时间非线性递增
            difficultyMultiplier = 1 + (score / 10) * 0.2;
            const currentSpawnRate = Math.max(200, baseSpawnRate - (score * 15)); 

            // 生成文字
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                let count = Math.floor(Math.random() * difficultyMultiplier) + 1;
                for(let i=0; i<count; i++) entities.push(new Enemy(difficultyMultiplier));
                spawnTimer = currentSpawnRate;
            }

            // 生成道具
            itemSpawnTimer -= dt;
            if (itemSpawnTimer <= 0) {
                entities.push(new Item());
                itemSpawnTimer = 15000 + Math.random() * 5000; // 15-20秒随机掉落
            }

            player.update(dt);
            
            // 实体更新与碰撞结算
            const playerHitbox = player.getHitbox();
            for (let i = entities.length - 1; i >= 0; i--) {
                const entity = entities[i];
                entity.update(dt);

                if (!entity.active) {
                    entities.splice(i, 1);
                    continue;
                }

                if (checkCollision(playerHitbox, entity.getHitbox())) {
                    if (entity instanceof Enemy) {
                        if (!player.isInvincible) {
                            triggerGameOver();
                            break;
                        } else {
                            entity.active = false; // 无敌状态弹开文字
                        }
                    } else if (entity instanceof Item) {
                        player.isInvincible = true;
                        player.invincibleTimer = 3000; // 3秒无敌
                        invincibleIndicator.style.opacity = 1;
                        entity.active = false;
                    }
                }
            }
        }

        function draw() {
            // [极其关键] 每次重绘先垫底一个纯白背景，防止系统自动切成黑色或透明
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制清新的网格背景增加设计感
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.03)';
            ctx.lineWidth = 1;
            for(let i = 0; i < width; i += 30) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke(); }
            for(let i = 0; i < height; i += 30) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke(); }
            ctx.restore();

            entities.forEach(e => e.draw(ctx));
            player.draw(ctx);
        }

        function initGame() {
            resize();
            player = new Player();
            entities = [];
            score = 0;
            difficultyMultiplier = 1;
            spawnTimer = baseSpawnRate;
            itemSpawnTimer = 8000; // 第一次掉落时间
            
            scoreEl.textContent = '0.0';
            invincibleIndicator.style.opacity = 0;
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
        }

        function startGame() {
            initGame();
            currentState = GAME_STATE.PLAYING;
            startTime = Date.now();
            lastTime = performance.now();
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function triggerGameOver() {
            currentState = GAME_STATE.GAMEOVER;
            player.isRainbow = true;
            finalScoreEl.textContent = score.toFixed(1);
            
            // 稍微延迟显示菜单，让玩家欣赏一下彩虹脸
            setTimeout(() => {
                gameOverScreen.classList.remove('hidden');
            }, 500);
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // 初始渲染一帧，防止黑屏
        resize();
        draw();
        
    </script>
</body>
</html>
